name: Build APRS Dashboard installers

# Builda o executável nativo (PyInstaller não faz cross-compile, por isso
# rodamos nos 3 runners de verdade) e sobe como asset de uma Release toda
# vez que uma tag "v*" é criada (ex: v1.0.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: aprs_dashboard-windows.exe
            build_path: dist/aprs_dashboard.exe
          - os: macos-latest
            asset_name: aprs_dashboard-macos
            build_path: dist/aprs_dashboard
          - os: ubuntu-latest
            asset_name: aprs_dashboard-linux
            build_path: dist/aprs_dashboard
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Buildar executável
        run: pyinstaller --noconfirm aprs_dashboard.spec

      - name: Renomear artefato
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.build_path }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Subir na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
