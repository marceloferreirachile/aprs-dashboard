name: Build APRS Dashboard installers

# Builda o executável nativo (PyInstaller não faz cross-compile, por isso
# rodamos nos 3 runners de verdade) e sobe como asset de uma Release toda
# vez que uma tag "v*" é criada (ex: v1.0.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign:
        description: "Assinar e notarizar o build de macOS (deixe desmarcado pra um teste rápido, sem gastar tempo com a Apple)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: aprs_dashboard-windows.exe
            build_path: dist/aprs_dashboard.exe
            package: false
          - os: macos-latest
            asset_name: aprs_dashboard-macos.zip
            build_path: dist/aprs_dashboard.app
            package: true
          - os: ubuntu-latest
            asset_name: aprs_dashboard-linux.zip
            build_path: dist/aprs_dashboard
            package: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Buildar executável
        run: pyinstaller --noconfirm aprs_dashboard.spec

      # Assinatura "ad-hoc" (gratuita, sem certificado) — só pra Apple Silicon
      # não recusar o app como "danificado" quando não tem NENHUMA assinatura.
      # Não substitui a assinatura de verdade (Developer ID, abaixo) — só
      # evita esse falso positivo nos builds de teste não assinados.
      - name: Ad-hoc sign (evita "app danificado" em builds de teste)
        if: matrix.os == 'macos-latest'
        run: codesign --force --deep -s - "dist/aprs_dashboard.app"

      # Assina/notariza sempre que for um lançamento de verdade (push de tag
      # v*). Numa execução manual (workflow_dispatch) só assina se marcar a
      # opção "sign" — deixado desmarcado, fica rápido pra testar tray icon,
      # bundle, zip, etc sem gastar minutos com a Apple.
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.sign == 'true')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Code sign app (Developer ID)
        if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.sign == 'true')
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --deep --force --options runtime --entitlements entitlements.plist --sign "$IDENTITY" "dist/aprs_dashboard.app"
          codesign --verify --deep --strict --verbose=2 "dist/aprs_dashboard.app"

      - name: Notarize app (App Store Connect API key, reused from ftapp)
        if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.sign == 'true')
        timeout-minutes: 15
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [[ "$ASC_KEY_CONTENT" == -----BEGIN* ]]; then
            printf '%s' "$ASC_KEY_CONTENT" > AuthKey.p8
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > AuthKey.p8
          fi
          ditto -c -k --keepParent "dist/aprs_dashboard.app" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key AuthKey.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/aprs_dashboard.app"
          rm -f notarize.zip AuthKey.p8

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.package }}" = "true" ]; then
            # GitHub Releases doesn't preserve Unix permissions on raw file
            # downloads, so macOS/Linux need to travel inside a zip (which
            # does preserve them) or double-clicking/running them breaks.
            dir=$(dirname "${{ matrix.build_path }}")
            file=$(basename "${{ matrix.build_path }}")
            if [ -d "${{ matrix.build_path }}" ]; then
              # macOS .app bundle: fix the executable bit inside it, then
              # zip the whole bundle recursively so it stays a bundle.
              chmod +x "${{ matrix.build_path }}/Contents/MacOS/"* 2>/dev/null || true
              (cd "$dir" && zip -r "$OLDPWD/out/${{ matrix.asset_name }}" "$file")
            else
              chmod +x "${{ matrix.build_path }}"
              (cd "$dir" && zip "$OLDPWD/out/${{ matrix.asset_name }}" "$file")
            fi
          else
            cp "${{ matrix.build_path }}" "out/${{ matrix.asset_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Subir na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
